<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ArtifactA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#f4f5fa; --surface:#ffffff; --ink:#14142b; --muted:#5a5c78; --line:#e4e6f1;
      --accent:#e8265c; --accent-hover:#c81f4f; --on-accent:#ffffff;
      --grid:rgba(20,20,43,.045); --shadow:0 1px 2px rgba(20,20,43,.05),0 24px 60px -24px rgba(20,20,43,.28);
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg:#0c0c20; --surface:#15153a; --ink:#eaebf6; --muted:#a3a6c6; --line:#292954;
        --accent:#ff5c82; --accent-hover:#ff789a; --on-accent:#1a0410;
        --grid:rgba(255,255,255,.04); --shadow:0 1px 2px rgba(0,0,0,.4),0 30px 70px -28px rgba(0,0,0,.8);
      }
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
      font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
      background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:44px 44px;-webkit-font-smoothing:antialiased}
    .card{width:min(92vw,400px);background:var(--surface);border:1px solid var(--line);border-radius:16px;
      box-shadow:var(--shadow);padding:36px 34px 30px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
    .brand .mark{width:16px;height:16px;border-radius:5px;background:var(--accent);
      box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
    h1{font-size:22px;letter-spacing:-.02em;margin:26px 0 8px;text-wrap:balance}
    p.lede{margin:0 0 26px;color:var(--muted);font-size:14.5px;line-height:1.55}
    .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:12px 16px;
      background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;font:600 15px "IBM Plex Sans",sans-serif;
      cursor:pointer;text-decoration:none;transition:background .12s}
    .btn:hover{background:var(--accent-hover)}
    .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .foot{margin-top:16px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;line-height:1.5}
    .foot .lock{flex:none;width:14px;height:14px}
    .divider{margin:22px 0;border:0;border-top:1px solid var(--line)}
    .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.02em}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="mark"></span> ArtifactA</div>
    <h1>Sign in to continue</h1>
    <p class="lede">A self-hosted home for AI-generated artifacts — access-controlled and audited on infrastructure your team owns.</p>
    <a class="btn" href="/login">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6l7-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sign in with SSO
    </a>
    <div class="foot">
      <svg class="lock" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/></svg>
      <span>You'll be redirected to your organization's identity provider.</span>
    </div>
    <hr class="divider">
    <div class="meta">private by default · every view audited</div>
  </div>
</body>
</html>
