name: release

# Cut a release by pushing a semver tag, e.g. `git tag v0.0.1 && git push origin v0.0.1`.
# Publishes the Docker image (service + CLI in one binary) to GHCR, and attaches
# cross-platform CLI binaries to the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload CLI assets
  packages: write # push the image to GHCR

jobs:
  image:
    name: docker image → ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/artifacta-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cli:
    name: cli binaries → release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Cross-compile the CLI
        working-directory: services/artifacta-api
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          LD="-s -w -X github.com/agarwalvivek29/here.now/services/artifacta-api/internal/cli.Version=${VERSION}"
          mkdir -p ../../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            bin="artifacta"; [ "$os" = "windows" ] && bin="artifacta.exe"
            echo "→ $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="$LD" -o "$bin" ./cmd/artifacta
            name="artifacta_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then zip -q "../../dist/${name}.zip" "$bin"; else tar -czf "../../dist/${name}.tar.gz" "$bin"; fi
            rm -f "$bin"
          done
          cd ../../dist && sha256sum * > checksums.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
