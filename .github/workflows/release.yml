name: release

# Cut a release by pushing a semver tag: `git tag v0.0.1 && git push origin v0.0.1`.
# Publishes two images to GHCR — `artifacta` (server; also contains the CLI) and
# `artifacta-cli` (slim, CLI-only) — and attaches cross-platform CLI binaries to
# the GitHub Release. workflow_dispatch(version) rebuilds/backfills just the images
# for an existing version without moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)build images for, e.g. 0.0.1"
        required: true

# Least privilege: each job asks for what it needs. Only `release` can write
# release assets; only `images` can push to GHCR.
permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.image }} → ghcr
    # On a tag, publish images only after the signed CLI release exists, so a
    # deployment never runs a version `artifacta upgrade` can't install. A
    # workflow_dispatch rebuild has no release job and runs on its own.
    needs: release
    permissions:
      contents: read
      packages: write # push images to GHCR
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: server
            image: artifacta
          - target: cli
            image: artifacta-cli
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "mm=${V%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/artifacta-api/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.mm }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}

  cli:
    name: cli binaries
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # only on a tag; dispatch just rebuilds images
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: Cross-compile the CLI
        working-directory: services/artifacta-api
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          LD="-s -w -X github.com/agarwalvivek29/here.now/services/artifacta-api/internal/cli.Version=${VERSION}"
          mkdir -p ../../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            bin="artifacta"; [ "$os" = "windows" ] && bin="artifacta.exe"
            echo "→ $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="$LD" -o "$bin" ./cmd/artifacta
            name="artifacta_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then zip -q "../../dist/${name}.zip" "$bin"; else tar -czf "../../dist/${name}.tar.gz" "$bin"; fi
            rm -f "$bin"
          done
          cd ../../dist && sha256sum * > checksums.txt && ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Signs checksums.txt (ADR-0029) and publishes the release. Kept apart from
  # the build so the signing key is only ever in a job that runs SHA-pinned
  # actions and no project code; `artifacta upgrade` refuses a release whose
  # checksums.txt.sig doesn't verify against the public key built into the CLI.
  release:
    name: sign + publish release
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload CLI assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          sparse-checkout: .github/release-signing.pub.pem
          sparse-checkout-cone-mode: false
      - name: Sign checksums
        env:
          SIGNING_KEY: ${{ secrets.ARTIFACTA_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "::error::ARTIFACTA_RELEASE_SIGNING_KEY is not set; refusing to publish an unsigned release"; exit 1; }
          # The system openssl, with no config or provider paths an earlier step could have set.
          ossl() { env -u OPENSSL_CONF -u OPENSSL_MODULES -u LD_PRELOAD /usr/bin/openssl "$@"; }
          ossl version
          key=$(mktemp); trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          ossl pkeyutl -sign -inkey "$key" -rawin -in dist/checksums.txt -out dist/checksums.txt.sig
          ossl pkeyutl -verify -pubin -inkey src/.github/release-signing.pub.pem -rawin \
            -in dist/checksums.txt -sigfile dist/checksums.txt.sig
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
