name: release

# Cut a release by pushing a semver tag: `git tag v0.0.1 && git push origin v0.0.1`.
# Publishes two images to GHCR — `artifacta` (server; also contains the CLI) and
# `artifacta-cli` (slim, CLI-only) — and attaches cross-platform CLI binaries to
# the GitHub Release. workflow_dispatch(version) rebuilds/backfills just the images
# for an existing version without moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)build images for, e.g. 0.0.1"
        required: true

permissions:
  contents: write # create the GitHub Release + upload CLI assets
  packages: write # push images to GHCR

jobs:
  images:
    name: ${{ matrix.image }} → ghcr
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: server
            image: artifacta
          - target: cli
            image: artifacta-cli
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "mm=${V%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/artifacta-api/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.mm }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}

  cli:
    name: cli binaries → release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # only on a tag; dispatch just rebuilds images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Cross-compile the CLI
        working-directory: services/artifacta-api
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          LD="-s -w -X github.com/agarwalvivek29/here.now/services/artifacta-api/internal/cli.Version=${VERSION}"
          mkdir -p ../../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            bin="artifacta"; [ "$os" = "windows" ] && bin="artifacta.exe"
            echo "→ $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="$LD" -o "$bin" ./cmd/artifacta
            name="artifacta_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then zip -q "../../dist/${name}.zip" "$bin"; else tar -czf "../../dist/${name}.tar.gz" "$bin"; fi
            rm -f "$bin"
          done
          cd ../../dist && sha256sum * > checksums.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
