syntax = "proto3";

package artifacta.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/agarwalvivek29/here.now/packages/schema/generated/go/artifacta/v1;artifactav1";

// ServiceAccount is a named, non-human principal (ADR-0028). Its subject is
// "sa:<name>"; it owns the artifacts it publishes. Names are never reused, so a
// disabled account keeps its row (disabled_at set) forever.
message ServiceAccount {
  string id = 1;
  string name = 2;
  string description = 3;
  string created_by_sub = 4;
  string created_by_email = 5;
  google.protobuf.Timestamp created_at = 6;
  // disabled_at is unset while the account is active. Disabling invalidates every
  // one of its keys immediately.
  google.protobuf.Timestamp disabled_at = 7;
  string disabled_by_sub = 8;
}

// ApiKey is one credential of a service account. Only the sha256 of the raw key
// is stored; the raw `afa_…` value is shown once at creation and never again.
message ApiKey {
  string id = 1;
  string service_account_id = 2;
  // key_hash is the hex sha256 of the raw key. Never returned by the API.
  string key_hash = 3;
  // prefix is the first characters of the raw key, for display and log lines.
  string prefix = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  // expires_at is unset for a key minted with ttl "never".
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp revoked_at = 8;
  google.protobuf.Timestamp last_used_at = 9;
  string created_by_sub = 10;
  string created_by_email = 11;
}
